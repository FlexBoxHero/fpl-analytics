<mat-toolbar color="primary">FPL Analytics Dashboard</mat-toolbar>

<main class="dashboard-wrapper">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Top Players</mat-card-title>
      <mat-card-subtitle>Data from official FPL bootstrap endpoint</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="metric-actions">
        <button
          mat-raised-button
          [color]="selectedMetric() === 'total_points' ? 'primary' : undefined"
          (click)="setMetric('total_points')"
        >
          Total Points
        </button>
        <button
          mat-raised-button
          [color]="selectedMetric() === 'now_cost' ? 'primary' : undefined"
          (click)="setMetric('now_cost')"
        >
          Current Cost
        </button>
      </div>

      @if (bootstrapStaticQuery.isLoading()) {
        <div class="loading-state">
          <mat-spinner [diameter]="36" />
        </div>
      } @else if (bootstrapStaticQuery.isError()) {
        <p class="error-state">Failed to load FPL data. Please try again.</p>
      } @else {
        <div class="chart-container">
          <canvas
            baseChart
            [type]="'bar'"
            [data]="chartData()"
            [options]="chartOptions"
          ></canvas>
        </div>
      }
    </mat-card-content>
  </mat-card>
</main>
